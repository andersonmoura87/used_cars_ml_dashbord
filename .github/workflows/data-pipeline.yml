name: Data Pipeline CI/CD

on:
  schedule:
    - cron: '0 0 * * *'  # Diariamente à meia-noite UTC
  push:
    paths:
      - 'src/etl/**'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'docs/ETL.md'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/etl/**'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'docs/ETL.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests (excluding smoke — requerem API ao vivo)
        env:
          DB_USER:     postgres
          DB_PASSWORD: postgres
          DB_HOST:     localhost
          DB_PORT:     5432
          DB_NAME:     test_db
        run: |
          pytest tests/ \
            --ignore=tests/smoke \
            --cov=src \
            --cov=scripts \
            --cov-report=xml \
            --cov-report=term-missing \
            -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ github.run_number }}
          path: coverage.xml
          if-no-files-found: ignore

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate production secrets
        env:
          ENVIRONMENT: production
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_NAME:     ${{ secrets.DB_NAME }}
        run: |
          python scripts/check_secrets.py --environment production --scope etl || {
            echo "::error::Secrets DB_* ausentes ou inseguros. Ver docs/SECRETS.md"
            exit 1
          }

      - name: Run ETL Pipeline (canônico)
        id: etl
        env:
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_NAME:     ${{ secrets.DB_NAME }}
          ENVIRONMENT: production
        run: |
          set +e
          python -m src.etl.run_pipeline
          ETL_RC=$?
          echo "etl_exit_code=$ETL_RC" >> "$GITHUB_OUTPUT"
          set -e
          if [ $ETL_RC -ne 0 ]; then
            echo "::error::ETL pipeline falhou com exit $ETL_RC"
            exit $ETL_RC
          fi

      # ── UCM-26: tendência de qualidade + alerta Slack ────────────────────────
      - name: Build quality trend dashboard
        id: quality
        if: always()
        run: |
          python scripts/quality_trend.py --days 30 || \
            echo "::warning::quality_trend.py falhou — verifique data/quality/"

      - name: Notify Slack — ETL result
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          ENVIRONMENT: production
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ETL_RC: ${{ steps.etl.outputs.etl_exit_code }}
        run: |
          STATUS="success"
          ERROR=""
          if [ "${ETL_RC:-0}" != "0" ]; then
            STATUS="failure"
            ERROR="ETL pipeline exit code ${ETL_RC}"
          fi
          META=$(ls -t logs/metadata/pipeline_*.json 2>/dev/null | head -1 || true)
          ARGS=(--status "$STATUS" --environment "$ENVIRONMENT" --run-url "$GITHUB_RUN_URL")
          [ -n "$ERROR" ] && ARGS+=(--error "$ERROR")
          [ -n "$META" ] && ARGS+=(--from-metadata "$META")
          python scripts/notify_etl.py "${ARGS[@]}" || \
            echo "::warning::notify_etl falhou (webhook ausente ou rede)"

      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipeline-artifacts-${{ github.run_number }}
          path: |
            data/quality/
            docs/quality/
            reports/
            logs/metadata/
          if-no-files-found: ignore
